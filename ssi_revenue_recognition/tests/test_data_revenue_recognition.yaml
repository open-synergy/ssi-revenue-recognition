options:
  auto_refresh: true

scenarios:
  - name: "User in the revenue_recognition group can create in draft"
    steps:
      - step: "Create the source analytic account of the contract"
        action: "create"
        model: "account.analytic.account"
        save_as: "source_aa_1"
        values:
          name: "Test Source AA - RR ACL 1"

      - step: "Create the Performance Obligation of the contract"
        action: "create"
        model: "performance_obligation"
        save_as: "pob_1"
        values:
          title: "Test PoB - RR ACL 1"
          source_analytic_account_id: "REC: source_aa_1.id"

      - step: "Create the customer partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_1"
        values:
          name: "Test Partner - RR ACL 1"

      - step: "Create the type's journal"
        action: "create"
        model: "account.journal"
        save_as: "type_journal_1"
        values:
          name: "Test Type Journal - RR ACL 1"
          code: "TTJ1RRACL"
          type: "general"

      - step: "Create the unearned income usage"
        action: "create"
        model: "product.usage_type"
        save_as: "usage_unearned_1"
        values:
          name: "Test Unearned Income Usage - RR ACL 1"
          code: "TU1RRACL"

      - step: "Create the income usage"
        action: "create"
        model: "product.usage_type"
        save_as: "usage_income_1"
        values:
          name: "Test Income Usage - RR ACL 1"
          code: "TI1RRACL"

      - step: "Create the recognition type"
        action: "create"
        model: "revenue_recognition_type"
        save_as: "rrt_1"
        values:
          name: "Test RR Type - RR ACL 1"
          code: "TRRT1RRACL"
          journal_id: "REC: type_journal_1.id"
          unearned_income_usage_id: "REC: usage_unearned_1.id"
          income_usage_id: "REC: usage_income_1.id"

      - step: "Create the recognition journal"
        action: "create"
        model: "account.journal"
        save_as: "journal_1"
        values:
          name: "Test Journal - RR ACL 1"
          code: "TJ1RRACL"
          type: "general"

      - step: "Create the unearned income account"
        action: "create"
        model: "account.account"
        save_as: "unearned_account_1"
        values:
          name: "Test Unearned Income Account - RR ACL 1"
          code: "TUA1RRACL"
          user_type_id: "REF: account.data_account_type_current_liabilities"

      - step: "Create the income account"
        action: "create"
        model: "account.account"
        save_as: "income_account_1"
        values:
          name: "Test Income Account - RR ACL 1"
          code: "TIA1RRACL"
          user_type_id: "REF: account.data_account_type_revenue"

      - step: "Create the user with the revenue_recognition group"
        action: "create"
        model: "res.users"
        save_as: "rr_user"
        values:
          name: "Test RR User - ACL"
          login: "test-rr-user-acl@example.com"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: ssi_revenue_recognition.revenue_recognition_user_group"

      - step: "Create revenue_recognition as the RR user"
        action: "create"
        model: "revenue_recognition"
        save_as: "rr_ok"
        as_user: "rr_user"
        values:
          type_id: "REC: rrt_1.id"
          partner_id: "REC: partner_1.id"
          performance_obligation_id: "REC: pob_1.id"
          date: 2024-01-31
          date_start: 2024-01-01
          date_end: 2024-01-31
          journal_id: "REC: journal_1.id"
          unearned_income_account_id: "REC: unearned_account_1.id"
          income_account_id: "REC: income_account_1.id"

      - step: "Record is created in draft state"
        action: "assert"
        target: "rr_ok"
        asserts:
          state:
            type: "value"
            expected: "draft"

  - name: "User without the revenue_recognition group cannot create"
    steps:
      - step: "Create the source analytic account of the contract"
        action: "create"
        model: "account.analytic.account"
        save_as: "source_aa_2"
        values:
          name: "Test Source AA - RR ACL 2"

      - step: "Create the Performance Obligation of the contract"
        action: "create"
        model: "performance_obligation"
        save_as: "pob_2"
        values:
          title: "Test PoB - RR ACL 2"
          source_analytic_account_id: "REC: source_aa_2.id"

      - step: "Create the customer partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_2"
        values:
          name: "Test Partner - RR ACL 2"

      - step: "Create the type's journal"
        action: "create"
        model: "account.journal"
        save_as: "type_journal_2"
        values:
          name: "Test Type Journal - RR ACL 2"
          code: "TTJ2RRACL"
          type: "general"

      - step: "Create the unearned income usage"
        action: "create"
        model: "product.usage_type"
        save_as: "usage_unearned_2"
        values:
          name: "Test Unearned Income Usage - RR ACL 2"
          code: "TU2RRACL"

      - step: "Create the income usage"
        action: "create"
        model: "product.usage_type"
        save_as: "usage_income_2"
        values:
          name: "Test Income Usage - RR ACL 2"
          code: "TI2RRACL"

      - step: "Create the recognition type"
        action: "create"
        model: "revenue_recognition_type"
        save_as: "rrt_2"
        values:
          name: "Test RR Type - RR ACL 2"
          code: "TRRT2RRACL"
          journal_id: "REC: type_journal_2.id"
          unearned_income_usage_id: "REC: usage_unearned_2.id"
          income_usage_id: "REC: usage_income_2.id"

      - step: "Create the recognition journal"
        action: "create"
        model: "account.journal"
        save_as: "journal_2"
        values:
          name: "Test Journal - RR ACL 2"
          code: "TJ2RRACL"
          type: "general"

      - step: "Create the unearned income account"
        action: "create"
        model: "account.account"
        save_as: "unearned_account_2"
        values:
          name: "Test Unearned Income Account - RR ACL 2"
          code: "TUA2RRACL"
          user_type_id: "REF: account.data_account_type_current_liabilities"

      - step: "Create the income account"
        action: "create"
        model: "account.account"
        save_as: "income_account_2"
        values:
          name: "Test Income Account - RR ACL 2"
          code: "TIA2RRACL"
          user_type_id: "REF: account.data_account_type_revenue"

      - step: "Create a plain internal user without the RR group"
        action: "create"
        model: "res.users"
        save_as: "plain_user"
        values:
          name: "Test Plain User - ACL"
          login: "test-plain-user-acl@example.com"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"

      - step: "Create revenue_recognition as the plain user must fail"
        action: "create"
        model: "revenue_recognition"
        as_user: "plain_user"
        expect_error:
          type: "AccessError"
        values:
          type_id: "REC: rrt_2.id"
          partner_id: "REC: partner_2.id"
          performance_obligation_id: "REC: pob_2.id"
          date: 2024-01-31
          date_start: 2024-01-01
          date_end: 2024-01-31
          journal_id: "REC: journal_2.id"
          unearned_income_account_id: "REC: unearned_account_2.id"
          income_account_id: "REC: income_account_2.id"
